version: 2

project_name: bubbleMonitor

before:
  hooks:
    - go generate ./...

gomod:
  proxy: true

builds:
  - id: bubbleMonitor
    main: ./cmd/bub
    binary: bub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-unknown-linux-gnu-gcc
          - CXX=aarch64-unknown-linux-gnu-g++
    hooks:
      post:
        - cp "{{ .Path }}" dist/bub_{{ .Os }}_{{ .Arch }}
        - chmod +x dist/bub_{{ .Os }}_{{ .Arch }}
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: binaries
    formats:
      - binary
    name_template: "bub_{{ .Os }}_{{ .Arch }}"
  - id: archives
    formats:
      - tar.gz
      - zip
    wrap_in_directory: false
    name_template: "bub_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: N1xev
    name: bubbleMonitor
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^refactor:"
