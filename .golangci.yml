version: "2"

run:
  modules-download-mode: readonly

linters:
  # Defaults cover errcheck, govet, ineffassign, staticcheck (incl. gosimple), unused
  enable:
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        # Struct field ordering micro-optimization: flags long-standing layouts
        # across the whole codebase and would require churn in every state struct.
        - fieldalignment

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: time-naming
        - name: errorf

    staticcheck:
      checks:
        - all
        - -SA1019
        # stylecheck (ST*) and quickfix (QF*) checks belonged to separate
        # linters that were never enabled in the golangci-lint v1 config.
        - -ST*
        - -QF*

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
